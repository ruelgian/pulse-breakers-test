<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#07060f">
  <title>PULSE BREAKERS</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #07060f;
      color: #e8fbff;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: block;
      background: #07060f;
      touch-action: none;
    }
    .veil {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      padding-top: calc(24px + env(safe-area-inset-top));
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      box-sizing: border-box;
      background: rgba(7, 6, 15, 0.94);
    }
    h1 {
      margin: 0 0 8px;
      font-weight: 700;
      letter-spacing: 0.14em;
      font-size: clamp(28px, 7vw, 56px);
    }
    p { margin: 6px 0; max-width: 34rem; line-height: 1.4; }
    .cyan { color: #67f6ff; }
    .dim { color: rgba(232, 251, 255, 0.72); font-size: 0.95rem; }
    button {
      margin-top: 22px;
      border: 0;
      border-radius: 999px;
      padding: 16px 28px;
      font: inherit;
      letter-spacing: 0.12em;
      color: #041016;
      background: #67f6ff;
      touch-action: manipulation;
    }
    #bar {
      width: min(280px, 70vw);
      height: 6px;
      margin-top: 18px;
      background: #1a2433;
      border-radius: 99px;
      overflow: hidden;
      display: none;
    }
    #bar > div {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, #67f6ff, #d16bff);
    }
    #turn { display: none; z-index: 4; }
    #boot { z-index: 3; }
    #warn {
      display: none;
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom));
      z-index: 5;
      padding: 10px 12px;
      background: #3a1020;
      color: #ffd7e6;
      border-radius: 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <canvas id="unity-canvas" width="1280" height="720" tabindex="-1"></canvas>
  <div id="boot" class="veil">
    <h1>PULSE//BREAKERS</h1>
    <p class="cyan">PULSE BREAKERS · test build</p>
    <p>Turn the phone sideways. Tap once to load. Tap again inside the arena to start the music.</p>
    <p class="dim" id="ios-hint"></p>
    <button id="go" type="button">TAP TO LOAD</button>
    <div id="bar"><div id="fill"></div></div>
  </div>
  <div id="turn" class="veil">
    <h1>ROTATE TO LANDSCAPE</h1>
    <p class="dim">iPhone Safari cannot lock rotation. Turn the phone, or Add to Home Screen and open it landscape.</p>
  </div>
  <div id="warn"></div>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var boot = document.querySelector("#boot");
    var turn = document.querySelector("#turn");
    var fill = document.querySelector("#fill");
    var bar = document.querySelector("#bar");
    var go = document.querySelector("#go");
    var started = false;

    function portrait() {
      if (window.matchMedia && window.matchMedia("(orientation: portrait)").matches)
        return true;
      return window.innerHeight > window.innerWidth + 40;
    }

    function refreshTurn() {
      turn.style.display = portrait() ? "flex" : "none";
    }

    var ios = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    if (ios)
      document.querySelector("#ios-hint").textContent = "Add to Home Screen for a fuller frame. Fullscreen does nothing in a normal Safari tab.";

    refreshTurn();
    window.addEventListener("resize", refreshTurn);
    window.addEventListener("orientationchange", function () { setTimeout(refreshTurn, 60); });

    function unityShowBanner(msg, type) {
      var warn = document.querySelector("#warn");
      warn.style.display = "block";
      warn.textContent = msg;
      if (type !== "error")
        setTimeout(function () { warn.style.display = "none"; }, 5000);
    }

    function begin(event) {
      if (started)
        return;
      started = true;
      if (event && event.preventDefault)
        event.preventDefault();
      go.style.display = "none";
      bar.style.display = "block";
      var root = document.documentElement;
      var req = root.requestFullscreen || root.webkitRequestFullscreen;
      if (req) {
        try { req.call(root); } catch (e) {}
      }
      if (screen.orientation && screen.orientation.lock)
        screen.orientation.lock("landscape").catch(function () {});

      var buildUrl = "Build";
      var config = {
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "GiantHologist",
        productName: "PULSE BREAKERS",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        devicePixelRatio: ios ? Math.min(window.devicePixelRatio || 1, 1.5) : (window.devicePixelRatio || 1)
      };
      var script = document.createElement("script");
      script.src = buildUrl + "/WebGL.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          fill.style.width = (100 * progress) + "%";
        }).then(function (instance) {
          window.pbUnity = instance;   // used by the automated screenshot harness (SendMessage)
          boot.style.display = "none";
        }).catch(function (message) {
          unityShowBanner(String(message), "error");
        });
      };
      script.onerror = function () {
        unityShowBanner("Could not load the game. Open this page over https, not as a file.", "error");
      };
      document.body.appendChild(script);
    }

    go.addEventListener("pointerdown", begin);
    boot.addEventListener("touchend", begin);
  </script>
</body>
</html>
